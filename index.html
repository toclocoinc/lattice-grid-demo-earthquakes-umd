<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Earthquakes around the world, as they are recorded</title>
    <meta
      name="description"
      content="Every earthquake recorded worldwide in the last seven days, from the United States Geological Survey, updated each minute. Built with Lattice Grid loaded by script tag, with no install and no build."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid's stylesheet, from jsDelivr. Every address on this page names
      the exact release, 1.61.0, and carries the hash of the file it expects,
      so the page can never quietly pick up a different build than the one it
      was checked against.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.61.0/lattice-grid.min.css"
      integrity="sha384-WTcZFO0MVNUYKtadh2+RF09Iwe00o6XsUJEE7e/ibFqKYBVdUNE+GSMX3mpTi7mA"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>Earthquakes around the world, as they are recorded</h1>
        <p class="loading-message">Starting...</p>
      </div>
    </main>

    <!--
      The library, as classic script tags. No npm install, no bundler, no
      `type="module"`: each file runs as it arrives and leaves a global behind.

        lattice-grid.min.js          LatticeGrid            the grid itself
        modules/charts.min.js        LatticeGrid.createChart  (extends the core, so it must follow it)
        modules/data-router.min.js   LatticeGridDataRouter
        modules/kpi.min.js           LatticeGridKPI
        modules/tabs.min.js          LatticeGridTabs

      The order matters once: the charts module folds itself into the core
      global rather than defining its own, so the core has to be there first.
      The other three are self-contained and could go in any order.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.61.0/lattice-grid.min.js"
      integrity="sha384-hDgc9MFUisxA1CBM0/eVe7Ityn9k3RsUWvhi9x/thbCEJqg1Z+s5Z0MLQDfjsVck"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.61.0/modules/charts.min.js"
      integrity="sha384-JiY2A7Ar5reVqBFZOp6qsFYhDsyHE8iWTi4s3LIbEjh6OJ/Lh0plY05XP3zJYwAH"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.61.0/modules/data-router.min.js"
      integrity="sha384-yJ7iF21YrTtHecr3aNZFrMJZxYueWczTU6BudQ0DETlAJSYRgXHRs+Vci3EFNLNc"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.61.0/modules/kpi.min.js"
      integrity="sha384-JmySXcjdAIUiMuA0mLLKoqEl0xABlNsxq3V9DFxymxaOKJUPXZ6pOhrio5XUTNIY"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.61.0/modules/tabs.min.js"
      integrity="sha384-AObtEdt74nyoeVLEDseS3eRuBWJ7WKxwvcynpU/DRfLVY3qkUUfKQT/HOb7cRogG"
      crossorigin="anonymous"
    ></script>

    <!-- The demo's own code, in the order each file needs the one before it. -->
    <script src="./src/licence.js"></script>
    <script src="./src/usgs-feed.js"></script>
    <script src="./src/dashboard.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
